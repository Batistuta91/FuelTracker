
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב תדלוק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B121C;
    --surface: #131C29;
    --surface-2: #1A2432;
    --border: #1F2A3A;
    --text: #F0EAD6;
    --text-muted: #7A8494;
    --text-dim: #4A5468;
    --dudu: #58D3F0;
    --ofira: #F0658C;
    --warn: #EF4444;
    --ok: #4ADE80;
    --amber: #FBBF24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { direction: rtl; }
  body {
    font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: 'tnum';
    background-image:
      radial-gradient(ellipse at top, rgba(88, 211, 240, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at bottom, rgba(240, 101, 140, 0.04) 0%, transparent 50%);
  }

  .container { max-width: 780px; margin: 0 auto; padding: 28px 24px 40px; }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.02em; }
  .brand-sub { font-size: 12px; color: var(--text-dim); }
  .sync-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--text-muted);
  }
  .sync-led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.3s;
  }
  .sync-led.ok { background: var(--ok); box-shadow: 0 0 8px rgba(74, 222, 128, 0.5); }
  .sync-led.syncing { background: var(--amber); box-shadow: 0 0 8px rgba(251, 191, 36, 0.5); animation: pulse 1s infinite; }
  .sync-led.error { background: var(--warn); box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
  @keyframes pulse { 50% { opacity: 0.4; } }

  /* Error banner */
  .error-banner {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 6px; padding: 12px 16px; margin-bottom: 20px;
    color: #FCA5A5; font-size: 13px; display: none;
  }
  .error-banner.show { display: block; }

  /* Loading */
  .loading-state { padding: 80px 20px; text-align: center; color: var(--text-dim); }
  .spinner {
    display: inline-block; width: 22px; height: 22px;
    border: 2px solid var(--border); border-top-color: var(--text);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Gauges */
  .gauges {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 24px;
  }
  .gauge-card {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 20px 20px;
    display: flex; flex-direction: column; align-items: center;
    transition: border-color 0.3s;
    position: relative;
  }
  .gauge-card.turn {
    border-color: rgba(239, 68, 68, 0.5);
    box-shadow: 0 0 24px rgba(239, 68, 68, 0.08), inset 0 0 24px rgba(239, 68, 68, 0.04);
  }
  .card-header {
    display: flex; justify-content: center; align-items: center;
    width: 100%; margin-bottom: 4px;
  }
  .person-name { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .turn-tag {
    position: absolute; top: 18px; inset-inline-end: 18px;
    font-size: 10px; font-weight: 600; color: var(--warn);
    letter-spacing: 0.06em; padding: 2px 8px;
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 999px; opacity: 0; transition: opacity 0.3s;
  }
  .gauge-card.turn .turn-tag { opacity: 1; }

  .gauge-svg { width: 100%; max-width: 220px; height: auto; margin: 8px 0 4px; }

  .days-readout { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 6px; }
  .days-num {
    font-size: 44px; font-weight: 700; color: var(--text);
    line-height: 1; letter-spacing: -0.02em;
  }
  .days-unit { font-size: 13px; color: var(--text-muted); }
  .last-line {
    font-size: 11px; color: var(--text-dim); margin-bottom: 18px;
    text-align: center; min-height: 15px;
  }
  .last-line .meta {
    color: var(--text-muted); padding-inline-start: 6px;
    border-inline-start: 1px solid var(--border); margin-inline-start: 6px;
  }

  .log-btn {
    width: 100%; padding: 12px; background: transparent;
    border: 1px solid currentColor; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em;
  }
  .gauge-card[data-person="dudu"] .log-btn { color: var(--dudu); }
  .gauge-card[data-person="ofira"] .log-btn { color: var(--ofira); }
  .log-btn:hover { background: currentColor; }
  .gauge-card[data-person="dudu"] .log-btn:hover,
  .gauge-card[data-person="ofira"] .log-btn:hover { color: var(--bg); }
  .log-btn:active { transform: scale(0.98); }
  .log-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Stats */
  .stats-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .stats-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px;
  }
  .stats-head h2 {
    font-size: 13px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.05em;
  }
  .stats-period { font-size: 11px; color: var(--text-dim); }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .stat-tile {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 10px;
    text-align: center;
  }
  .stat-value {
    font-size: 22px; font-weight: 600; color: var(--text);
    line-height: 1.1; letter-spacing: -0.01em;
  }
  .stat-label {
    font-size: 10px; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.05em;
  }

  .split-block { margin-top: 4px; }
  .split-bar {
    height: 6px; background: var(--border); border-radius: 999px;
    overflow: hidden; display: flex; margin-bottom: 8px;
  }
  .split-fill { height: 100%; transition: width 0.6s ease-out; }
  .split-fill.dudu { background: var(--dudu); }
  .split-fill.ofira { background: var(--ofira); }

  .split-legend {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-muted);
    flex-wrap: wrap; gap: 8px;
  }
  .split-item { display: flex; align-items: center; gap: 6px; }
  .split-item .sdot { width: 7px; height: 7px; border-radius: 50%; }
  .split-item .sdot.dudu { background: var(--dudu); }
  .split-item .sdot.ofira { background: var(--ofira); }
  .split-item .sval { color: var(--text); font-weight: 500; }

  .stats-meta {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
  }
  .stats-meta span strong { color: var(--text-muted); font-weight: 500; }

  .empty-stats {
    padding: 8px 0 4px; text-align: center;
    color: var(--text-dim); font-size: 12px;
  }

  /* History */
  .history-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px; padding: 0 2px;
  }
  .history-head h2 {
    font-size: 13px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.05em;
  }
  .history-count { font-size: 11px; color: var(--text-dim); }

  .history {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .empty { padding: 48px 24px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .entry {
    display: grid;
    grid-template-columns: auto auto 1fr auto auto;
    align-items: center;
    padding: 12px 18px; gap: 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .entry:last-child { border-bottom: none; }
  .entry-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .entry-dot.dudu { background: var(--dudu); box-shadow: 0 0 6px rgba(88, 211, 240, 0.4); }
  .entry-dot.ofira { background: var(--ofira); box-shadow: 0 0 6px rgba(240, 101, 140, 0.4); }
  .entry-name { color: var(--text); font-weight: 500; min-width: 50px; }
  .entry-date { color: var(--text-muted); font-size: 12px; }
  .entry-meta {
    color: var(--text-muted); font-size: 11px;
    padding: 2px 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    white-space: nowrap;
  }
  .delete-btn {
    background: transparent; border: 1px solid transparent;
    color: var(--text-muted); cursor: pointer;
    padding: 6px 10px; font-size: 13px;
    font-family: inherit; line-height: 1; border-radius: 6px;
    transition: all 0.15s;
  }
  .delete-btn:hover { color: var(--warn); border-color: rgba(239, 68, 68, 0.3); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(11, 18, 28, 0.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
    width: 100%; max-width: 440px;
    animation: pop 0.15s ease-out;
  }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h3 { font-size: 16px; font-weight: 500; color: var(--text); }
  .modal-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; margin-top: 2px; }

  .modal label {
    display: block; font-size: 11px; color: var(--text-muted);
    margin-bottom: 6px; margin-top: 14px; letter-spacing: 0.04em;
  }
  .modal label:first-of-type { margin-top: 0; }
  .modal input {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 13px; direction: rtl;
    background: var(--bg); color: var(--text); color-scheme: dark;
  }
  .modal input:focus { outline: none; border-color: var(--text-muted); }
  .modal input[type="number"] { direction: ltr; text-align: right; }
  .modal input[type="number"]::-webkit-inner-spin-button,
  .modal input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .modal input[type="number"] { -moz-appearance: textfield; }

  .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-row label { margin-top: 14px; }

  .modal-hint {
    font-size: 11px; color: var(--text-dim);
    margin-top: 12px; text-align: center;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-primary, .btn-secondary {
    padding: 10px 20px; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent;
  }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-primary:hover { background: white; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--text-muted); border-color: var(--border); }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-muted); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 8px 12px 20px;
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--text);
    z-index: 200; opacity: 0;
    transition: transform 0.3s ease-out, opacity 0.3s;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast-icon {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
  }
  .toast-undo {
    background: none; border: none;
    color: var(--dudu); cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 6px 12px; margin-inline-start: 4px;
  }
  .toast-undo:hover { color: white; }

  @media (max-width: 520px) {
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    .container { padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
    header { margin-bottom: 24px; padding-bottom: 16px; }
    .brand h1 { font-size: 22px; }
    .brand-sub { font-size: 13px; }
    .gauges { grid-template-columns: 1fr; gap: 14px; }
    .gauge-card { padding: 22px 20px 20px; }
    .person-name { font-size: 26px; }
    .days-num { font-size: 44px; }
    .days-unit { font-size: 14px; }
    .last-line { font-size: 12px; }
    .gauge-svg { max-width: 300px; }
    .log-btn { padding: 14px; font-size: 15px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-value { font-size: 20px; }
    .stat-tile { padding: 14px 6px; }
    .entry { grid-template-columns: auto auto 1fr auto; gap: 10px; padding: 14px 14px; }
    .entry-name { font-size: 14px; }
    .entry-date { font-size: 12px; }
    .entry-meta { display: none; }
    .delete-btn { padding: 8px 12px; font-size: 15px; }
    .modal { padding: 22px 20px; }
    .modal input { padding: 12px; font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>מעקב תדלוק</h1>
      <span class="brand-sub">דודו · אופירה</span>
    </div>
    <div class="sync-badge">
      <span id="syncText"></span>
      <span class="sync-led" id="syncLed"></span>
    </div>
  </header>

  <div class="error-banner" id="errorBanner"></div>

  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <div>טוען…</div>
  </div>

  <div id="appContent" style="display:none;">
    <div class="gauges" id="gauges"></div>
    <div id="statsWrap"></div>

    <div class="history-head">
      <h2>היסטוריה</h2>
      <span class="history-count" id="historyCount"></span>
    </div>
    <div class="history" id="history"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="modal-sub">רישום תדלוק חדש</div>

    <label>תאריך ושעה</label>
    <input type="datetime-local" id="modalDate">

    <label>עלות (₪)</label>
    <input type="number" id="modalCost" placeholder="250" inputmode="decimal" step="0.01" min="0">

    <label>ליטרים</label>
    <input type="number" id="modalLiters" placeholder="45" inputmode="decimal" step="0.1" min="0">

    <label>קילומטראז'</label>
    <input type="number" id="modalKm" placeholder="87500" inputmode="numeric" step="1" min="0">

    <div class="modal-hint">כל השדות אופציונליים. סכומים וליטרים עוזרים לסטטיסטיקה.</div>

    <div class="modal-actions">
      <button class="btn-primary" id="confirmBtn" onclick="confirmLog()">שמור</button>
      <button class="btn-secondary" onclick="closeModal()">ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon"></span>
  <span id="toastMsg"></span>
  <button class="toast-undo" id="toastUndo" style="display:none;">בטל</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzgf5eya_3A7Po3FALKavEujUxpebOiF7sM3f8BNJp7auQwxZj1fONWzumvV6hEr3LM/exec';
const NAMES = { dudu: 'דודו', ofira: 'אופירה' };
const FULL_DAYS = 14;

let entries = [];
let pendingPerson = null;

// === API ===
async function api(payload) {
  const opts = payload
    ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' }
    : { method: 'GET', redirect: 'follow' };
  const res = await fetch(API_URL, opts);
  if (!res.ok) throw new Error('שגיאת רשת ' + res.status);
  return res.json();
}
async function apiList() { const d = await api(null); return d.entries || []; }
async function apiAdd(entry) { const d = await api({ action: 'add', entry }); if (!d.ok) throw new Error(d.error || 'שגיאה'); }
async function apiDelete(id) { const d = await api({ action: 'delete', id }); if (!d.ok) throw new Error(d.error || 'שגיאה'); }

// === Sync UI ===
function setSync(state, msg) {
  document.getElementById('syncLed').className = 'sync-led ' + state;
  document.getElementById('syncText').textContent = msg || '';
}
function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.textContent = msg;
  b.classList.add('show');
  clearTimeout(showError._t);
  showError._t = setTimeout(() => b.classList.remove('show'), 6000);
}

// === Toast ===
function showToast(msg, undoAction) {
  const toast = document.getElementById('toast');
  const undo = document.getElementById('toastUndo');
  document.getElementById('toastMsg').textContent = msg;
  if (undoAction) {
    undo.style.display = 'inline-block';
    undo.onclick = () => { undoAction(); hideToast(); };
  } else {
    undo.style.display = 'none';
  }
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(hideToast, 6000);
}
function hideToast() { document.getElementById('toast').classList.remove('show'); }

async function initialLoad() {
  setSync('syncing', 'מסנכרן');
  try {
    entries = await apiList();
    setSync('ok', 'מסונכרן');
  } catch (e) {
    setSync('error', 'לא מחובר');
    showError('לא הצלחתי להתחבר לגיליון: ' + e.message);
  }
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('appContent').style.display = 'block';
  render();
}

// === Helpers ===
function lastEntryFor(person) {
  return entries.filter(e => e.person === person)
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
}
function daysSince(iso) {
  if (!iso) return null;
  const now = new Date();
  const then = new Date(iso);
  const nowDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const thenDay = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  return Math.round((nowDay - thenDay) / (1000*60*60*24));
}
function daysLabel(n) {
  if (n === null) return '';
  if (n === 0) return 'היום';
  if (n === 1) return 'יום מאז התדלוק';
  if (n === 2) return 'יומיים מאז התדלוק';
  return 'ימים מאז התדלוק';
}
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' }) +
    ' · ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatMeta(e) {
  const parts = [];
  if (e.cost) parts.push('₪' + (e.cost % 1 === 0 ? e.cost : e.cost.toFixed(2)));
  if (e.liters) parts.push(e.liters + 'L');
  if (e.km) parts.push(e.km.toLocaleString('he-IL') + ' ק"מ');
  if (parts.length === 0 && e.note) return escapeHtml(e.note);
  return parts.join(' · ');
}

// === Gauge SVG ===
function gaugeSvg(person, days, isTurn) {
  const gid = 'grad_' + person;
  const needleColor = person === 'dudu' ? 'var(--dudu)' : 'var(--ofira)';
  const clamped = days === null ? FULL_DAYS : Math.max(0, Math.min(FULL_DAYS, days));
  const angle = -90 + (clamped / FULL_DAYS) * 180;

  const ticks = [];
  for (let i = 0; i <= 6; i++) {
    const a = (-90 + (i / 6) * 180) * Math.PI / 180;
    const cx = 100, cy = 100, r1 = 72, r2 = 78;
    const x1 = cx + r1 * Math.cos(a - Math.PI / 2);
    const y1 = cy + r1 * Math.sin(a - Math.PI / 2);
    const x2 = cx + r2 * Math.cos(a - Math.PI / 2);
    const y2 = cy + r2 * Math.sin(a - Math.PI / 2);
    const isEnd = (i === 0 || i === 6);
    ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${isEnd ? '#4A5468' : '#2A3444'}" stroke-width="${isEnd ? 2 : 1}" stroke-linecap="round"/>`);
  }

  return `
    <svg class="gauge-svg" viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="${gid}" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#EF4444"/>
          <stop offset="0.5" stop-color="#FBBF24"/>
          <stop offset="1" stop-color="#4ADE80"/>
        </linearGradient>
      </defs>
      <path d="M 20 100 A 80 80 0 0 1 180 100" stroke="#1F2A3A" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 20 100 A 80 80 0 0 1 180 100" stroke="url(#${gid})" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.72"/>
      ${ticks.join('')}
      <text x="16" y="118" fill="#4ADE80" font-size="10" font-weight="600" font-family="Rubik">F</text>
      <text x="178" y="118" fill="${isTurn ? '#EF4444' : '#4A5468'}" font-size="10" font-weight="600" font-family="Rubik">E</text>
      <g style="transform: rotate(${angle}deg); transform-origin: 100px 100px; transition: transform 1.1s cubic-bezier(.34,1.3,.64,1);">
        <line x1="100" y1="100" x2="100" y2="30" stroke="${needleColor}" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="100" cy="30" r="3" fill="${needleColor}"/>
      </g>
      <circle cx="100" cy="100" r="8" fill="var(--surface-2)" stroke="${needleColor}" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="3" fill="${needleColor}"/>
    </svg>
  `;
}

// === Stats ===
function computeStats() {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisMonth = entries.filter(e => new Date(e.timestamp) >= monthStart);
  const monthLabel = now.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });

  if (thisMonth.length === 0) {
    return { hasData: false, monthLabel };
  }

  const sum = (arr, key) => arr.reduce((s, e) => s + (e[key] || 0), 0);
  const totalCost = sum(thisMonth, 'cost');
  const totalLiters = sum(thisMonth, 'liters');
  const totalCount = thisMonth.length;

  const perPerson = {
    dudu: thisMonth.filter(e => e.person === 'dudu'),
    ofira: thisMonth.filter(e => e.person === 'ofira')
  };

  const hasCost = totalCost > 0;
  const hasLiters = totalLiters > 0;

  const costByPerson = {
    dudu: sum(perPerson.dudu, 'cost'),
    ofira: sum(perPerson.ofira, 'cost')
  };
  const litersByPerson = {
    dudu: sum(perPerson.dudu, 'liters'),
    ofira: sum(perPerson.ofira, 'liters')
  };

  // Averages (all time, based on entries that have the relevant fields)
  const withBoth = entries.filter(e => e.cost && e.liters);
  const avgCostPerL = withBoth.length > 0
    ? (withBoth.reduce((s, e) => s + e.cost, 0) / withBoth.reduce((s, e) => s + e.liters, 0))
    : null;
  const withLiters = entries.filter(e => e.liters);
  const avgLitersPerFill = withLiters.length > 0
    ? (withLiters.reduce((s, e) => s + e.liters, 0) / withLiters.length)
    : null;

  // Km between fills (based on all-time km readings, chronological)
  const kmEntries = entries.filter(e => e.km).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  let avgKmPerFill = null;
  if (kmEntries.length >= 2) {
    const diff = kmEntries[kmEntries.length - 1].km - kmEntries[0].km;
    if (diff > 0) avgKmPerFill = Math.round(diff / (kmEntries.length - 1));
  }

  return {
    hasData: true, monthLabel,
    totalCost, totalLiters, totalCount,
    hasCost, hasLiters,
    costByPerson, litersByPerson,
    countByPerson: { dudu: perPerson.dudu.length, ofira: perPerson.ofira.length },
    avgCostPerL, avgLitersPerFill, avgKmPerFill
  };
}

function renderStats() {
  const s = computeStats();
  const wrap = document.getElementById('statsWrap');

  if (!s.hasData) {
    wrap.innerHTML = `
      <div class="stats-section">
        <div class="stats-head">
          <h2>סיכום החודש</h2>
          <span class="stats-period">${s.monthLabel}</span>
        </div>
        <div class="empty-stats">אין תדלוקים החודש</div>
      </div>
    `;
    return;
  }

  const tiles = [];
  if (s.hasCost) tiles.push({ v: '₪' + Math.round(s.totalCost).toLocaleString('he-IL'), l: 'עלות' });
  if (s.hasLiters) tiles.push({ v: (s.totalLiters % 1 === 0 ? s.totalLiters : s.totalLiters.toFixed(1)) + 'L', l: 'ליטרים' });
  tiles.push({ v: s.totalCount, l: s.totalCount === 1 ? 'תדלוק' : 'תדלוקים' });

  // Split: prefer cost, then liters, then count
  let splitLabel, splitTotal, splitDudu, splitOfira, splitFmt;
  if (s.hasCost) {
    splitTotal = s.totalCost;
    splitDudu = s.costByPerson.dudu;
    splitOfira = s.costByPerson.ofira;
    splitFmt = v => '₪' + Math.round(v).toLocaleString('he-IL');
  } else if (s.hasLiters) {
    splitTotal = s.totalLiters;
    splitDudu = s.litersByPerson.dudu;
    splitOfira = s.litersByPerson.ofira;
    splitFmt = v => (v % 1 === 0 ? v : v.toFixed(1)) + 'L';
  } else {
    splitTotal = s.totalCount;
    splitDudu = s.countByPerson.dudu;
    splitOfira = s.countByPerson.ofira;
    splitFmt = v => v + '';
  }

  const pctDudu = splitTotal > 0 ? (splitDudu / splitTotal) * 100 : 0;
  const pctOfira = splitTotal > 0 ? (splitOfira / splitTotal) * 100 : 0;

  // Meta averages
  const metaParts = [];
  if (s.avgCostPerL) metaParts.push(`<span><strong>₪${s.avgCostPerL.toFixed(2)}</strong> לליטר</span>`);
  if (s.avgLitersPerFill) metaParts.push(`<span><strong>${s.avgLitersPerFill.toFixed(1)}L</strong> לתדלוק</span>`);
  if (s.avgKmPerFill) metaParts.push(`<span><strong>${s.avgKmPerFill.toLocaleString('he-IL')}</strong> ק"מ בין תדלוקים</span>`);

  wrap.innerHTML = `
    <div class="stats-section">
      <div class="stats-head">
        <h2>סיכום החודש</h2>
        <span class="stats-period">${s.monthLabel}</span>
      </div>
      <div class="stats-grid">
        ${tiles.map(t => `<div class="stat-tile"><div class="stat-value">${t.v}</div><div class="stat-label">${t.l}</div></div>`).join('')}
      </div>
      <div class="split-block">
        <div class="split-bar">
          <div class="split-fill dudu" style="width: ${pctDudu}%"></div>
          <div class="split-fill ofira" style="width: ${pctOfira}%"></div>
        </div>
        <div class="split-legend">
          <span class="split-item">
            <span class="sdot dudu"></span>
            דודו <span class="sval">${splitFmt(splitDudu)}</span>
          </span>
          <span class="split-item">
            <span class="sdot ofira"></span>
            אופירה <span class="sval">${splitFmt(splitOfira)}</span>
          </span>
        </div>
      </div>
      ${metaParts.length ? `<div class="stats-meta">${metaParts.join('')}</div>` : ''}
    </div>
  `;
}

// === Render ===
function render() {
  const gauges = document.getElementById('gauges');
  const persons = ['dudu', 'ofira'];
  const lasts = persons.map(p => ({ p, entry: lastEntryFor(p) }));

  let turnPerson = null;
  const withNo = lasts.filter(l => !l.entry);
  if (withNo.length === 1) turnPerson = withNo[0].p;
  else if (withNo.length === 0)
    turnPerson = [...lasts].sort((a, b) => new Date(a.entry.timestamp) - new Date(b.entry.timestamp))[0].p;

  gauges.innerHTML = persons.map(p => {
    const last = lastEntryFor(p);
    const days = last ? daysSince(last.timestamp) : null;
    const isTurn = turnPerson === p;
    const meta = last ? formatMeta(last) : '';
    return `
      <div class="gauge-card ${isTurn ? 'turn' : ''}" data-person="${p}">
        <div class="card-header">
          <span class="person-name">${NAMES[p]}</span>
          <span class="turn-tag">התור</span>
        </div>
        ${gaugeSvg(p, days, isTurn)}
        ${last
          ? `<div class="days-readout">
               <span class="days-num">${days}</span>
               <span class="days-unit">${daysLabel(days)}</span>
             </div>
             <div class="last-line">${formatDate(last.timestamp)}${meta ? `<span class="meta">${meta}</span>` : ''}</div>`
          : `<div class="days-readout">
               <span class="days-num">—</span>
               <span class="days-unit">טרם תודלק</span>
             </div>
             <div class="last-line"></div>`
        }
        <button class="log-btn" onclick="openLog('${p}')">תדלקתי עכשיו</button>
      </div>
    `;
  }).join('');

  renderStats();

  const history = document.getElementById('history');
  const count = document.getElementById('historyCount');
  count.textContent = entries.length
    ? (entries.length === 1 ? 'רישום אחד' : `${entries.length} רישומים`)
    : '';

  if (!entries.length) {
    history.innerHTML = '<div class="empty">אין רישומים עדיין. לחצו על "תדלקתי עכשיו".</div>';
    return;
  }

  const sorted = [...entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  history.innerHTML = sorted.map(e => {
    const meta = formatMeta(e);
    return `
      <div class="entry">
        <span class="entry-dot ${e.person}"></span>
        <span class="entry-name">${NAMES[e.person]}</span>
        <span class="entry-date">${formatDate(e.timestamp)}</span>
        ${meta ? `<span class="entry-meta">${meta}</span>` : '<span></span>'}
        <button class="delete-btn" onclick="deleteEntry('${e.id}')" title="מחק">✕</button>
      </div>
    `;
  }).join('');
}

// === Actions ===
function openLog(person) {
  pendingPerson = person;
  document.getElementById('modalTitle').textContent = NAMES[person];
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('modalDate').value = now.toISOString().slice(0, 16);
  document.getElementById('modalCost').value = '';
  document.getElementById('modalLiters').value = '';
  document.getElementById('modalKm').value = '';
  document.getElementById('confirmBtn').disabled = false;
  document.getElementById('confirmBtn').textContent = 'שמור';
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  pendingPerson = null;
}

function parseNum(id) {
  const v = document.getElementById(id).value.trim();
  if (!v) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

async function confirmLog() {
  if (!pendingPerson) return;
  const dateVal = document.getElementById('modalDate').value;
  if (!dateVal) return;

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    person: pendingPerson,
    timestamp: new Date(dateVal).toISOString(),
    cost: parseNum('modalCost'),
    liters: parseNum('modalLiters'),
    km: parseNum('modalKm')
  };

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'שומר…';
  setSync('syncing', 'שומר');

  try {
    await apiAdd(entry);
    entries.push(entry);
    setSync('ok', 'מסונכרן');
    closeModal();
    render();
    showToast('נשמר', async () => {
      entries = entries.filter(x => x.id !== entry.id);
      render();
      try { await apiDelete(entry.id); } catch (err) { showError('בוטל מקומית, מחיקה בשרת נכשלה'); }
    });
  } catch (e) {
    setSync('error', 'שגיאה');
    showError('לא הצלחתי לשמור: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'שמור';
  }
}

async function deleteEntry(id) {
  if (!confirm('למחוק את הרישום?')) return;
  setSync('syncing', 'מוחק');
  try {
    await apiDelete(id);
    entries = entries.filter(e => e.id !== id);
    setSync('ok', 'מסונכרן');
    render();
  } catch (e) {
    setSync('error', 'שגיאה');
    showError('לא הצלחתי למחוק: ' + e.message);
  }
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    apiList().then(list => { entries = list; setSync('ok', 'מסונכרן'); render(); }).catch(() => {});
  }
});

initialLoad();
</script>
